name: Jarvis
options:
  bundleIdPrefix: io.pumpkit
  createIntermediateGroups: true
packages:
  JarvisClient:
    path: JarvisClient
settings:
  base:
    SWIFT_VERSION: "6.0"
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Jarvis:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - JarvisApp
    dependencies:
      - package: JarvisClient
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1"
        PRODUCT_BUNDLE_IDENTIFIER: io.pumpkit.jarvis
    info:
      path: .generated/Info.plist
      properties:
        CFBundleDisplayName: Jarvis
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSMicrophoneUsageDescription: Jarvis records only while you use the Talk key.
        NSCameraUsageDescription: Scan the pairing code shown by Jarvis on your Mac.
        # Temporary: bundled conversation fonts for the font selector in Settings.
        UIAppFonts:
          - AnonymousPro-Bold.ttf
          - AnonymousPro-Regular.ttf
          - AtkinsonHyperlegibleMono-Variable.ttf
          - CascadiaCode-Variable.ttf
          - CommitMono-Bold.ttf
          - CommitMono-Regular.ttf
          - DejaVuSansMono-Bold.ttf
          - DejaVuSansMono.ttf
          - FiraCode-Variable.ttf
          - GeistMono-Variable.ttf
          - Hack-Bold.ttf
          - Hack-Regular.ttf
          - IBMPlexMono-Regular.ttf
          - IBMPlexMono-SemiBold.ttf
          - Inconsolata-Variable.ttf
          - IntelOneMono-Bold.ttf
          - IntelOneMono-Regular.ttf
          - JetBrainsMono-Variable.ttf
          - MartianMono-Variable.ttf
          - RedHatMono-Variable.ttf
          - RobotoMono-Variable.ttf
          - ShareTechMono-Regular.ttf
          - SourceCodePro-Variable.ttf
          - SpaceMono-Bold.ttf
          - SpaceMono-Regular.ttf
          - UbuntuMono-Bold.ttf
          - UbuntuMono-Regular.ttf
          - VT323-Regular.ttf
          - VictorMono-Variable.ttf
        UIBackgroundModes:
          - audio
schemes:
  Jarvis:
    build:
      targets:
        Jarvis: all
    run:
      config: Debug
