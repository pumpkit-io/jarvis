[project]
name = "jarvis-hub"
version = "0.1.0"
description = "The Jarvis Hub: the always-running process that holds the conversation and runs the agents."
requires-python = ">=3.12,<3.13"
dependencies = [
    "claude-agent-sdk>=0.2.177,<0.3",
]

[project.scripts]
jarvis-hub = "jarvis_hub.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jarvis_hub"]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pyright>=1.1.390",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "real_model: talks to the real model on the Max subscription; runs only with JARVIS_REAL_MODEL_TESTS=1",
]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"
