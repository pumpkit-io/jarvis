# sdlc checks on every pull request, written by the sdlc setup-sdlc skill.
# comment-slop: the code-comments patterns a regex can catch, in the lines the PR adds. Needs no secrets.
# review: the review-changes skill, run by Claude Code with your Claude subscription. It posts the
# report as one PR comment and fails when the verdict is blocking (a standards breach, a missing or
# wrong spec requirement, or a likely bug). It needs the CLAUDE_CODE_OAUTH_TOKEN secret (create it
# with `claude setup-token`) and skips draft PRs and PRs from forks, so nobody outside the repo can
# spend your usage. Make both jobs required checks in branch protection to block merges on them.
name: sdlc review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: sdlc-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  comment-slop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: git clone --depth 1 https://github.com/pumpkit-io/sdlc "$RUNNER_TEMP/sdlc"
      - name: Check the comments this PR adds
        run: git diff -U0 "$BASE_SHA...$HEAD_SHA" | perl "$RUNNER_TEMP/sdlc/hooks/comment-slop.pl"
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}

  review:
    if: github.event.pull_request.draft == false && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      issues: read
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: anthropics/claude-code-action@v1
        id: review
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          plugin_marketplaces: https://github.com/pumpkit-io/sdlc.git
          plugins: sdlc@pumpkit-io
          display_report: "false"
          show_full_output: "false"
          prompt: |
            Load the review-changes skill and review pull request #${{ github.event.pull_request.number }}. This is a CI job, so nobody can answer questions.

            - Fixed point: ${{ github.event.pull_request.base.sha }}. HEAD is the pull request's head commit.
            - Spec: the issues the pull request body or its commit messages reference. Read the body with `gh pr view ${{ github.event.pull_request.number }}`. With no reference, skip the Spec axis.
            - Do not write or edit files. Return the complete final Markdown report as your final response. Its first line must be exactly `## sdlc review of ${{ github.event.pull_request.head.sha }}`. Do not add an introduction or wrap the report in a code fence. Include separate nonempty `## Standards`, `## Spec` and `## Correctness` sections in that order, followed by exactly one final line: `Verdict: pass` or `Verdict: blocking (N hard findings)` with a positive integer N. Do not include intermediate tool output or execution events.

            Final response structure (replace each placeholder with the review, and choose exactly one valid verdict):
            ## sdlc review of ${{ github.event.pull_request.head.sha }}

            ## Standards
            <Standards findings or explicit no-findings statement>

            ## Spec
            <Spec findings or reason this axis is skipped>

            ## Correctness
            <Correctness findings or explicit no-findings statement>

            <Verdict: pass OR Verdict: blocking (N hard findings)>
          claude_args: |
            --model sonnet
            --disallowedTools "Write,Edit,NotebookEdit"
            --allowedTools "Read,Glob,Grep,Task,Agent,Skill,Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(git rev-parse:*),Bash(git merge-base:*),Bash(gh pr view:*),Bash(gh issue view:*)"
      - name: Validate and emit the final review
        id: report
        env:
          EXECUTION_FILE: ${{ steps.review.outputs.execution_file }}
          REVIEW_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          python3 .github/scripts/review_report.py \
            --execution-file "$EXECUTION_FILE" --head "$REVIEW_HEAD" \
            --report "$RUNNER_TEMP/sdlc-review.md" --github-output "$GITHUB_OUTPUT"
      - uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: sdlc-review
          path: ${{ runner.temp }}/sdlc-review.md
      - name: Fail on a blocking verdict
        env:
          REVIEW_VERDICT: ${{ steps.report.outputs.verdict }}
        run: |
          echo "Review verdict: $REVIEW_VERDICT"
          [ "$REVIEW_VERDICT" = "pass" ]
